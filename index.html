    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 90px;
    }

    /* Banner Principal */
    .hero {
      position: relative;
      width: 100%;
      height: 60vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 70%, #000000 100%),
                  url('IMG_2933.jpeg') center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .hero-content {
      width: 100%;
      max-width: 600px;
    }

    .badge {
      display: inline-block;
      background: rgba(0, 102, 255, 0.25);
      border: 1px solid #0066ff;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .hero-title span {
      color: #0066ff;
    }

    .hero-subtitle {
      font-size: 13px;
      color: #aaaaaa;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-main {
      background-color: #ffffff;
      color: #000000;
      padding: 12px 26px;
      border-radius: 25px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-sec {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Leitor de Vídeo da Aula */
    .video-section {
      display: none;
      padding: 10px 20px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #0066ff44;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.2);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Seção de Módulos */
    .section-container {
      padding: 25px 20px 10px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .section-header span {
      font-size: 12px;
      color: #666;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card-thumb {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: 14px;
      border: 1px solid #222222;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      cursor: pointer;
      background-size: cover;
      background-position: center;
    }

    .card-badge {
      position: relative;
      z-index: 2;
      font-size: 10px;
      color: #ffffff;
      background: #0066ff;
      padding: 4px 10px;
      border-radius: 12px;
      width: fit-content;
      font-weight: 600;
    }

    .card-title-container {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.82);
      padding: 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
    }

    /* Menu Inferior */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #000000;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 14px;
      z-index: 100;
    }

    .nav-item {
      color: #666666;
      text-decoration: none;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .nav-item.active {
      color: #0066ff;
    }
  </style>

  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
      } else {
        alert("Para adicionar ao ecrã principal:\n\n• No iPhone (Safari): Toque no botão 'Partilhar' e escolha 'Adicionar ao Ecrã Principal'.\n• No Android (Chrome): Toque nos três pontos do navegador e selecione 'Instalar Aplicação'.");
      }
    }

    function toggleDesktopView() {
      const viewport = document.querySelector('meta[name="viewport"]');
      if (viewport.getAttribute('content').includes('1280')) {
        viewport.setAttribute('content', 'width=device-width, initial-scale=1.0');
        alert("Modo mobile ativado.");
      } else {
        viewport.setAttribute('content', 'width=1280');
        alert("Modo computador ativado.");
      }
    }

    function openPlayer(videoUrl) {
      const player = document.getElementById('player');
      const iframe = document.getElementById('iframe-video');
      iframe.src = videoUrl;
      player.style.display = 'block';
      player.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
