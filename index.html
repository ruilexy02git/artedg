<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Digital - Videoaulas</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #E50914;
            text-align: center;
        }
        p {
            text-align: center;
            color: #aaaaaa;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-top: 20px;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arte Digital</h1>
        <p>Bem-vindo ao catálogo de videoaulas!</p>
        
        <div class="video-box">
            <iframe src="https://www.youtube.com/embed/La3A7_GhF3w" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
